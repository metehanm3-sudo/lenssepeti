# tools/ klasöründe bir dosya (ör. data.py) değişince sayfaları yeniden üretir ve kaydeder.
# GitHub Pages ("Deploy from a branch": main) bu kaydı görüp siteyi kendiliğinden yayınlar.
name: Siteyi güncelle

on:
  push:
    branches: [main]
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfaları üret
        run: |
          python3 tools/build.py
          python3 tools/export.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Site sayfaları güncellendi"
            git push
          fi
